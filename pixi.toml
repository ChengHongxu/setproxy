[workspace]
name = "setproxy-dev"
version = "0.1.0"
description = "Setproxy development environment"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
rust = ">=1.83"
git = "*"

[tasks]
# Rust 开发任务
build = "cargo build"
build-release = "cargo build --release"
test = "cargo test"
fmt = "cargo fmt"
clippy = "cargo clippy"
run = "cargo run"

# 交叉编译任务
build-all = { cmd = """
  cargo build --release --target x86_64-unknown-linux-gnu &&
  cargo build --release --target aarch64-unknown-linux-gnu &&
  cargo build --release --target x86_64-apple-darwin &&
  cargo build --release --target aarch64-apple-darwin &&
  cargo build --release --target x86_64-pc-windows-gnu
""", description = "构建所有平台的二进制文件" }

# 开发辅助
dev = { cmd = "cargo watch -x run", description = "监听文件变化并自动重新运行" }
check = { cmd = "cargo fmt && cargo clippy && cargo test", description = "格式化、检查和测试" }

[activation]
scripts = ["echo '🦀 Rust 开发环境已激活'"]
