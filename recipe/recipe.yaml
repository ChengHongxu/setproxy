schema_version: 1

context:
  version: "0.3.1"

package:
  name: setproxy
  version: ${{ version }}

source:
  # The repo provides LICENSE
  - git: https://github.com/ChengHongxu/setproxy.git
    tag: v${{ version }}

build:
  number: 0
  script:
    # Download the appropriate binary for this platform
    - if: unix
      then:
        - mkdir -p $PREFIX/bin
        - |
          if [[ "$CONDA_BUILD_CROSS_COMPILATION" != "1" ]]; then
            case "$(uname -s)-$(uname -m)" in
              Linux-x86_64)
                curl -fsSL -o $PREFIX/bin/setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/setproxy-linux-amd64
                ;;
              Linux-aarch64)
                curl -fsSL -o $PREFIX/bin/setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/setproxy-linux-arm64
                ;;
              Darwin-x86_64)
                curl -fsSL -o $PREFIX/bin/setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/setproxy-darwin-amd64
                ;;
              Darwin-arm64)
                curl -fsSL -o $PREFIX/bin/setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/setproxy-darwin-arm64
                ;;
            esac
            chmod +x $PREFIX/bin/setproxy
          fi
    - if: win
      then:
        - mkdir %PREFIX%\\Scripts
        - curl -fsSL -o %PREFIX%\\Scripts\\setproxy.exe https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/setproxy-windows-amd64.exe

requirements:
  build:
    - curl
  # No runtime dependencies - bash/zsh are system packages

tests:
  - script:
      - setproxy --version
      - setproxy --help

about:
  homepage: https://github.com/ChengHongxu/setproxy
  repository: https://github.com/ChengHongxu/setproxy
  license: MIT
  license_file: LICENSE
  summary: Cross-platform proxy environment variable manager
  description: |
    setproxy is a CLI tool to manage proxy environment variables
    with support for WSL2 auto-detection. Use it to quickly switch
    proxy settings in your terminal.

    After installation, set up shell integration once and open a new terminal:

        setproxy init            # detects zsh / bash / PowerShell
        setproxy init zsh        # or name the shell

    It adds `eval "$(setproxy hook zsh)"` (or the bash / PowerShell
    equivalent) to the startup file.

    Usage:
      setproxy 127.0.0.1 7890  # Set proxy
      setproxy wsl             # Auto-detect WSL2 host
      setproxy status          # Show current proxy
      setproxy clear           # Clear proxy
  documentation: https://github.com/ChengHongxu/setproxy#readme

extra:
  recipe-maintainers:
    - ChengHongxu
