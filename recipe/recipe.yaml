schema_version: 1

context:
  version: "0.2.0"

package:
  name: setproxy
  version: ${{ version }}

source:
  # Get shell wrapper scripts from the repo
  - git: https://github.com/ChengHongxu/setproxy.git
    tag: v${{ version }}

build:
  number: 0
  script:
    # Download the appropriate binary for this platform
    - if: unix
      then:
        - mkdir -p $PREFIX/bin
        - cd $BUILD_PREFIX
        - |
          if [[ "$CONDA_BUILD_CROSS_COMPILATION" != "1" ]]; then
            case "$(uname -s)-$(uname -m)" in
              Linux-x86_64)
                curl -fsSL -o _setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/_setproxy-linux-amd64
                ;;
              Linux-aarch64)
                curl -fsSL -o _setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/_setproxy-linux-arm64
                ;;
              Darwin-x86_64)
                curl -fsSL -o _setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/_setproxy-darwin-amd64
                ;;
              Darwin-arm64)
                curl -fsSL -o _setproxy https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/_setproxy-darwin-arm64
                ;;
            esac
            chmod +x _setproxy
            install -m 755 _setproxy $PREFIX/bin/_setproxy
            install -m 755 shell/setproxy-wrapper.sh $PREFIX/bin/setproxy
          fi
    - if: win
      then:
        - mkdir %PREFIX%\\Scripts
        - curl -fsSL -o _setproxy.exe https://github.com/ChengHongxu/setproxy/releases/download/v${{ version }}/_setproxy-windows-amd64.exe
        - copy _setproxy.exe %PREFIX%\\Scripts\\_setproxy.exe
        - copy shell\\setproxy-wrapper.ps1 %PREFIX%\\Scripts\\setproxy.ps1

requirements:
  build:
    - curl
  run:
    - bash  # [unix]

tests:
  - script:
      - _setproxy --version
      - _setproxy --help

about:
  homepage: https://github.com/ChengHongxu/setproxy
  repository: https://github.com/ChengHongxu/setproxy
  license: MIT
  license_file: LICENSE
  summary: Cross-platform proxy environment variable manager
  description: |
    setproxy is a CLI tool to manage proxy environment variables
    with support for WSL2 auto-detection. Use it to quickly switch
    proxy settings in your terminal.

    Usage:
      setproxy 127.0.0.1 7890  # Set proxy
      setproxy wsl             # Auto-detect WSL2 host
      setproxy status          # Show current proxy
      setproxy clear           # Clear proxy
  documentation: https://github.com/ChengHongxu/setproxy#readme

extra:
  recipe-maintainers:
    - ChengHongxu
