name: Release
on:
  push:
    tags: ['v*']
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: _setproxy-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: _setproxy-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: _setproxy-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: _setproxy-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: _setproxy-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compile tools
        if: matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/_setproxy ${{ matrix.asset }}
          strip ${{ matrix.asset }} || true

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: copy target\${{ matrix.target }}\release\_setproxy.exe ${{ matrix.asset }}
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  conda-package:
    needs: release
    strategy:
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest
          - platform: osx-64
            os: macos-13  # Intel runner
          - platform: osx-arm64
            os: macos-latest  # Apple Silicon
          - platform: win-64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          mkdir -p recipe/checksums
          cd artifacts
          for file in *; do
            sha256sum "$file" 2>/dev/null || shasum -a 256 "$file" | cut -d' ' -f1 > ../recipe/checksums/"${file#_setproxy-}".sha256
          done
          cd ..
          ls -la recipe/checksums/

      - name: Install pixi and rattler-build
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi global install rattler-build

      - name: Build conda package for ${{ matrix.platform }}
        shell: bash
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          rattler-build build --recipe recipe/recipe.yaml --target-platform ${{ matrix.platform }}

      - name: Upload conda package
        uses: actions/upload-artifact@v4
        with:
          name: conda-package-${{ matrix.platform }}
          path: output/**/*.conda

  trigger-channel-update:
    needs: conda-package
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Trigger packages repo update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CHANNEL_DISPATCH_TOKEN }}
          repository: ChengHongxu/packages
          event-type: add-conda-package
          client-payload: |
            {
              "package": "setproxy",
              "version": "${{ steps.version.outputs.VERSION }}",
              "run_id": "${{ github.run_id }}"
            }
